[project]
name = "takulife"
version = "0.1.0"
description = "RESTful API backend for takulife."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.116.0,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "boto3>=1.43.47",
    "brotli>=1.1.0",
    "defusedxml>=0.7,<1.0",
    "dj-database-url>=2.2,<3.0",
    "django>=5.2.17,<6.0",
    "django-allauth[mfa,socialaccount]>=65.12,<66.0",
    "django-axes>=8,<9",
    "django-storages>=1.14.6",
    "djangorestframework>=3.15,<4.0",
    "drf-spectacular[sidecar]>=0.30.0",
    "gunicorn>=26.0.0",
    "httpx>=0.27,<1.0",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.2,<4.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "playwright>=1.61.0",
    "pytest>=9.0,<10.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.8,<5.0",
    "pytest-playwright>=0.9.0",
    "pytest-xdist>=3.8,<4.0",
    "ruff>=0.15,<0.16",
]

[tool.coverage.run]
# Migrations are framework-generated and run once against the DB; their
# data-backfill (RunPython) bodies don't execute on an empty test DB and are
# not meaningful test targets. Measure application code only.
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover"]

# Python 스타일은 Google 가이드를 기준으로 하되 AGENTS.md "Python Style Guide"의
# 예외(줄 길이 100칸, 테스트 E501 제외)를 따른다. 규칙을 바꾸면 그 절도 함께 고친다.
[tool.ruff]
line-length = 100
# migrations는 생성 코드라 검사·포맷 대상이 아니다.
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "W", "F", "I", "B006", "TID252"]

[tool.ruff.lint.per-file-ignores]
# 테스트 이름은 한국어 행동 중심 규칙과 개명 제한 때문에 줄일 수 없다.
"tests/**" = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
case-sensitive = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
