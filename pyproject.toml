[project]
name = "takulife"
version = "0.1.0"
description = "RESTful API backend for takulife."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.116.0,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "defusedxml>=0.7,<1.0",
    "dj-database-url>=2.2,<3.0",
    "django>=5.2,<6.0",
    "django-allauth[mfa,socialaccount]>=65.12,<66.0",
    "django-axes>=8,<9",
    "djangorestframework>=3.15,<4.0",
    "httpx>=0.27,<1.0",
    "pillow>=12.2.0",
    "psycopg[binary]>=3.2,<4.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.8,<5.0",
    "pytest-playwright>=0.8.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[tool.coverage.run]
# Migrations are framework-generated and run once against the DB; their
# data-backfill (RunPython) bodies don't execute on an empty test DB and are
# not meaningful test targets. Measure application code only.
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover"]
