[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
python_files = tests.py test_*.py *_tests.py
markers =
    unit: pure functions, parsing, value rules — no DB or HTTP.
    domain: model/service business behavior and invariants — DB as needed.
    web: HTTP request/response, auth, permission, and error translation via the Django/DRF test client.
    contract: architecture, settings, migration, and performance contracts.
    slow: security lockouts, real files, and abnormal-recovery scenarios — explicit opt-in.
# Browser e2e (pytest-playwright + live_server) was removed on 2026-07-22 by
# user decision: tests cover backend logic only. The whole suite runs in one
# pass, so there is no opt-in deselect here. Playwright itself stays in the dev
# group as a verification tool for manual browser measurement.
addopts = --strict-markers
