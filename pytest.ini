[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
markers =
    e2e: end-to-end browser tests (Playwright + Django live_server). Run with `-m e2e`.
# E2E tests need Chromium + a live server, so they are opt-in: the default run
# stays fast and dependency-light. Run them with `pytest -m e2e` (override the
# default deselect via `pytest -m e2e` or `pytest -o addopts=`).
addopts = -m "not e2e"
