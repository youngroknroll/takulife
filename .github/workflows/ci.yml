name: CI

on:
  push:
    branches: [main]
  pull_request:
    # production으로 가는 배포 PR은 main에서 이미 CI를 통과한 커밋만 담으므로
    # 여기서 다시 돌리지 않는다(자동 생성 PR에 승인 대기 실행이 남는 것도 막는다).
    branches-ignore: [production]

# Cancel a superseded run when new commits land on the same ref (e.g. rapid
# PR pushes), saving free-tier Actions minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# DATABASE_URL matches the docker-compose.yml taku/taku Postgres convention
# already used for local dev (see docker-compose.yml, .env.example). CI never
# checks out a .env file, so config/settings.py's env-based DATABASE_URL
# wiring is exercised directly against the service container below instead of
# falling back to sqlite.
env:
  DATABASE_URL: postgresql://taku:taku@localhost:5432/taku

jobs:
  test:
    name: Test suite (PR gate)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taku
          POSTGRES_USER: taku
          POSTGRES_PASSWORD: taku
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taku -d taku"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Django system check
        run: uv run python manage.py check

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      # 번역 단언 테스트와 .po 플레이스홀더 가드가 .mo 컴파일 결과를
      # 전제하므로, 테스트 실행 전에 카탈로그를 컴파일한다.
      - name: Compile translation catalogs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext
          uv run django-admin compilemessages --ignore .venv

      # -n auto: pytest-xdist (dev group). Targeted and e2e runs stay serial; see docs/BE/test-suite-speed.md.
      - name: Run test suite
        run: uv run pytest -q -n auto

      # Production-like env for `check --deploy`. SECRET_KEY is a throwaway
      # value for structural validation only, never a real secret — it is
      # generated at runtime below (repeating, low-entropy pattern) instead
      # of a literal in this file, so a high-entropy-looking string never
      # sits in source for a secret scanner to flag (GitGuardian false
      # positive on PR #173). It still clears Django's own W009 check
      # (>=50 chars, >=5 unique chars, no "django-insecure-" prefix).
      # fail-level stays at the default (ERROR only): W021 (HSTS preload) is
      # a deliberate, approved deferral (config/settings.py build_secure_ssl_
      # settings sets SECURE_HSTS_PRELOAD=False — submitting to the browser
      # preload list is an irreversible, separate decision, see plan §8).
      # `--fail-level WARNING` would fail on W021 every run, so instead this
      # step greps the warning output and fails only if a warning other than
      # W021 appears — new/regressed warnings still gate the PR.
      - name: Deployment checklist (check --deploy)
        env:
          DEBUG: "false"
          ALLOWED_HOSTS: ci.example
          CSRF_TRUSTED_ORIGINS: https://ci.example
          SECURE_SSL: "true"
          SECURE_COOKIES: "true"
        run: |
          set -o pipefail
          export SECRET_KEY="ci-dummy-$(uv run python -c "print('0123456789abcdef' * 4)")"
          uv run python manage.py check --deploy 2>&1 | tee deploy-check.txt
          if grep -E '\(security\.W[0-9]+\)' deploy-check.txt | grep -v 'security\.W021'; then
            echo "::error::Deploy check produced a warning beyond the accepted W021 (HSTS preload) exception"
            exit 1
          fi

  e2e:
    # Observation period: this job does not gate merges yet. Promote it to a
    # required gate once main has a streak of non-flaky green runs (rule
    # recorded in docs/backlog.md).
    name: E2E journey suite (observation, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taku
          POSTGRES_USER: taku
          POSTGRES_PASSWORD: taku
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taku -d taku"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      # No DEBUG env here: STORAGES["staticfiles"] is decided from env DEBUG
      # at import time, so DEBUG=false would make it require a manifest that
      # this job never builds, failing every static asset lookup.
      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('uv.lock') }}

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      # -m e2e overrides pytest.ini addopts' "-m not e2e", so this is the only
      # place the journey suite runs; `uv run pytest -q` elsewhere stays backend-only.
      - name: Run e2e journey suite
        run: uv run pytest -q -m e2e tests/e2e --tracing retain-on-failure --output e2e-artifacts

      # Traces can carry test session cookies and test passwords (never
      # production secrets), so keep the retention window short.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e-artifacts/
          retention-days: 7

      # Rollback: add `if: false` to this job to pause it while keeping the suite in the repo.

  lint:
    name: Lint and format (PR gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python 3.13
        run: uv python install 3.13

      # ruff는 dev 그룹이라 uv.lock에 고정된 버전을 그대로 쓴다.
      - name: Install dependencies
        run: uv sync --frozen

      # 규칙과 줄 길이는 pyproject.toml [tool.ruff]가 정한다(AGENTS.md "Python Style Guide").
      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      # Rollback: remove this job and the CI assertions in tests/core/test_lint_gate_contract.py
      # in one commit (docs/BE/python-style.md "롤백 순서").

  audit:
    name: Dependency vulnerability audit (PR gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python 3.13
        run: uv python install 3.13

      # Exported straight from uv.lock (no `uv sync`/install needed) so the
      # audit covers the dev group too (pytest, playwright, etc.), matching
      # the scope of the OSV scan this job is meant to keep enforcing.
      - name: Export locked requirements
        run: uv export --format requirements.txt --frozen --no-emit-project --no-hashes -o requirements-audit.txt

      - name: Audit dependencies for known vulnerabilities
        run: uvx pip-audit==2.9.0 -r requirements-audit.txt --no-deps --strict

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taku
          POSTGRES_USER: taku
          POSTGRES_PASSWORD: taku
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taku -d taku"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t takulife:ci .

      # Actually boot the built image against the postgres service instead of
      # only proving `docker build` succeeds — this exercises the real deploy
      # path (entrypoint.sh: migrate -> collectstatic -> gunicorn) so entrypoint
      # regressions (permissions, paths, migrate/collectstatic failures,
      # gunicorn not starting) surface here instead of on first deploy.
      # --network host puts the container on the runner host's network so it
      # can reach the postgres service container, which GitHub Actions
      # publishes onto localhost:5432 of the runner (not a separate Docker
      # network the built image would otherwise share).
      - name: Boot container and wait for /api/health/
        run: |
          set -o pipefail

          # Throwaway, structurally-valid-but-obviously-fake SECRET_KEY (same
          # low-entropy repeating pattern as the deploy checklist step above)
          # so a secret scanner doesn't mistake it for a real credential.
          SECRET_KEY="docker-smoke-$(printf '0123456789abcdef%.0s' 1 2 3 4)"

          docker run -d --name takulife-smoke \
            --network host \
            -e DATABASE_URL="postgresql://taku:taku@localhost:5432/taku" \
            -e SECRET_KEY="$SECRET_KEY" \
            -e ALLOWED_HOSTS="localhost" \
            -e DEBUG="false" \
            takulife:ci

          status=0
          for attempt in $(seq 1 30); do
            if curl -fsS "http://localhost:8000/api/health/" > /dev/null 2>&1; then
              echo "Health check passed on attempt ${attempt}"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::/api/health/ did not return 200 within the timeout"
              status=1
            fi
            sleep 2
          done

          # On failure, replay the request without swallowing anything so the
          # next run tells us *why* instead of just *that* it failed: a
          # non-zero curl exit means the connection itself was refused/reset
          # (port not listening, container dead), while a zero exit with a
          # non-200 http_code means gunicorn answered but Django rejected/
          # errored the request (response body may carry the reason, e.g. a
          # DisallowedHost or 500 error page).
          if [ "$status" -ne 0 ]; then
            echo "---- diagnostics: container still running? ----"
            docker ps -a --filter name=takulife-smoke

            echo "---- diagnostics: is anything listening on :8000? ----"
            ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null || echo "neither ss nor netstat is available"

            echo "---- diagnostics: one more request, nothing discarded ----"
            http_code=$(curl -sS -o /tmp/health-body.txt -w '%{http_code}' "http://localhost:8000/api/health/")
            echo "curl exit code: $?"
            echo "HTTP status code: ${http_code}"
            echo "---- response headers ----"
            curl -sS -D - -o /dev/null "http://localhost:8000/api/health/" 2>&1 || true
            echo "---- response body ----"
            cat /tmp/health-body.txt 2>/dev/null || echo "(no body captured)"
          fi

          echo "---- container logs (takulife-smoke) ----"
          docker logs takulife-smoke
          docker rm -f takulife-smoke

          exit "$status"
