{% extends "base.html" %}

{% block title %}로그인 — takulife{% endblock %}

{% block content %}
<main class="auth-container">
  <h1>로그인</h1>
  {% if form.errors %}
    <p class="auth-error">아이디 또는 비밀번호가 올바르지 않습니다.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="form-group">
      <label for="id_username">아이디</label>
      {{ form.username }}
    </div>
    <div class="form-group">
      <label for="id_password">비밀번호</label>
      {{ form.password }}
    </div>
    <button type="submit" class="btn-primary">로그인</button>
  </form>
  <p><a href="{% url 'accounts:register' %}">계정이 없으신가요? 회원가입</a></p>
</main>
{% endblock %}
