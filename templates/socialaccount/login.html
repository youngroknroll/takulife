{% extends "base.html" %}
{% load static %}

{% block title %}소셜 로그인 확인 — takulife{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/pages/auth.css' %}">
{% endblock %}

{% block content %}
<main class="auth-container" id="content">
  <h1>{{ provider.name }} 계정으로 계속할까요?</h1>
  <p>{{ provider.name }} 계정으로 로그인을 진행합니다.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-primary btn-block">계속하기</button>
  </form>
  <p><a href="{% url 'account_login' %}">로그인으로 돌아가기</a></p>
</main>
{% endblock %}
