{% extends "base.html" %}
{% load static %}

{% block title %}서버 오류가 발생했어요 — takulife{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/pages/errors.css' %}">
{% endblock %}

{% block content %}
<main class="page error-page" id="content">
  <span class="error-page-bg" aria-hidden="true">500</span>
  <div class="error-page-body">
    <p class="error-page-label">ERROR 500</p>
    <h1 class="error-page-title">서버 오류가 발생했어요</h1>
    <p class="error-page-message">
      일시적인 오류로 요청을 처리하지 못했습니다. 잠시 후 다시 시도해 주세요.
    </p>
    <ul class="error-page-links">
      <li class="error-page-link-row">
        <a class="error-page-link is-brand" href="/">홈으로 돌아가기<span
           class="error-page-arrow" aria-hidden="true">→</span></a>
      </li>
    </ul>
  </div>
</main>
{% endblock %}
