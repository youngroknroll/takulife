{% comment %}
스태프 콘솔 전용 헤더다. /staff/* 페이지에서 공개 사이트 헤더 대신 이걸
쓴다(staff/base_staff.html이 교체).

2단 상단바: 1단은 브랜드만, 2단은 콘솔 탭(대시보드/드래프트/이벤트/홈
카테고리)과 오른쪽 "사이트로 돌아가기" 링크다. 사이드바·접기 토글·아이콘·
배지는 의도적으로 없다.
{% endcomment %}
{% load static %}
<a class="skip-link" href="#staff-main">본문으로 건너뛰기</a>
<header class="staff-shell-header">
  <div class="staff-shell-topbar">
    <span class="staff-shell-brand">takulife 스태프 콘솔</span>
  </div>
  <div class="staff-shell-tabrow">
    <nav class="staff-shell-tabs nav-links" aria-label="스태프 콘솔 메뉴">
      <a href="/staff/dashboard/"{% if request.resolver_match.url_name == 'dashboard' %} class="active"{% endif %}>스태프 콘솔</a>
      <a href="/staff/drafts/"{% if request.resolver_match.url_name == 'draft-list' or request.resolver_match.url_name == 'draft-detail' %} class="active"{% endif %}>드래프트 관리</a>
      <a href="/staff/events/"{% if request.resolver_match.url_name == 'event-list' or request.resolver_match.url_name == 'event-edit' %} class="active"{% endif %}>이벤트 관리</a>
      <a href="/staff/home-categories/"{% if request.resolver_match.url_name == 'home-categories' %} class="active"{% endif %}>홈 카테고리</a>
    </nav>
    <a class="staff-shell-exit" href="/">사이트로 돌아가기 ↗</a>
  </div>
</header>
<script defer src="{% static 'js/components/staff-shell.js' %}"></script>
