services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taku
      POSTGRES_USER: taku
      POSTGRES_PASSWORD: taku
    ports:
      - "5432:5432"
    volumes:
      - taku_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taku -d taku"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  taku_postgres_data:
